services:
  station-warehouse:
    build: .
    image: station-warehouse:1.0
    container_name: station-warehouse
    ports:
      - "8000:8000"
    volumes:
      - station-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  station-data:
